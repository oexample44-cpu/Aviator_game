<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aviator</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{background:#0e1120;color:#fff;font-family:sans-serif;margin:0}.top{padding:15px;display:flex;justify-content:space-between;background:#1c2038}.bal{color:#ffeb3b;font-weight:700}.mid{text-align:center;padding:10px}.mult{font-size:72px;font-weight:900;color:#ff3b3b} .plane-box{background:#191d33;margin:10px;border-radius:15px;height:260px;position:relative;overflow:hidden} #plane{position:absolute;left:10px;bottom:10px;font-size:32px} .btns{padding:15px;display:flex;gap:10px} .betbox{background:#232845;padding:12px;border-radius:12px;flex:1;text-align:center} .cash{background:#00c853;border:none;border-radius:12px;flex:1.5;color:#fff;font-weight:900;font-size:18px}</style></head><body><div class="top"><span>✈️ Aviator</span><span class="bal">Bal: <b id="bal">2500</b></span></div><div class="mid"><div class="mult" id="mult">1.00x</div><div id="status">Place BET to start</div></div><div class="plane-box"><div id="plane">✈️</div></div><div class="btns"><div class="betbox">Bet<br><button onclick="ch(-10)">-</button> <span id="b">10</span> <button onclick="ch(10)">+</button></div><button class="cash" id="btn" onclick="go()">BET</button></div><script>
let bal=2500,bet=10,mult=1,play=false,crash=0,t;function ch(d){bet=Math.max(10,Math.min(100,bet+d));document.getElementById('b').innerText=bet;if(!play)document.getElementById('btn').innerText='BET '+bet}function go(){if(play){cash();return}if(bal<bet)return alert('Low balance');bal-=bet;upd();play=true;mult=1;crash=(Math.random()<0.3?1+Math.random()*0.9:1.5+Math.random()*8).toFixed(2);document.getElementById('status').innerText='Flying... Crash @ '+crash+'x';loop()}function loop(){t=setInterval(()=>{mult+=0.04+mult*0.01;document.getElementById('mult').innerText=mult.toFixed(2)+'x';document.getElementById('plane').style.left=(mult*12)+'px';document.getElementById('plane').style.bottom=(Math.min(mult*10,210))+'px';document.getElementById('btn').innerText='CASHOUT '+(bet*mult).toFixed(0);if(mult>=crash){clearInterval(t);document.getElementById('status').innerText='💥 CRASHED '+crash+'x';document.getElementById('btn').innerText='BET AGAIN';play=false}},100)}function cash(){clearInterval(t);let win=bet*mult;bal+=win;upd();document.getElementById('status').innerText='✅ Won '+win.toFixed(0);document.getElementById('btn').innerText='BET AGAIN';play=false}function upd(){document.getElementById('bal').innerText=Math.floor(bal)}
</script></body></html>
