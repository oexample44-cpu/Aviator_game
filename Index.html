<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Aviator PRO - Fixed</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0e0e14;color:#fff}.header{background:#1e1e2e;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff0033}.bal{background:#2a2a3a;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:13px;border:1px solid #444}.add{background:#00c851;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-weight:900;cursor:pointer;font-size:12px}.box{max-width:500px;margin:auto;padding:10px}.hist{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.h{padding:4px 10px;border-radius:15px;font-size:11px;font-weight:bold;color:#fff}.game{background:radial-gradient(circle at 30% 80%,#2a0a1a,#12121a);border-radius:15px;height:320px;position:relative;border:2px solid #333;margin:10px 0;overflow:hidden}.mult{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;text-shadow:0 0 20px #ff0040;z-index:2}.st{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#00c851;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:bold;z-index:2}.plane{position:absolute;font-size:32px;left:15px;bottom:20px;z-index:2}.panel{background:#1e1e2e;border-radius:12px;padding:12px;margin-top:10px}.row{display:flex;gap:8px;margin:8px 0}.row input{flex:1;background:#0e0e14;border:2px solid #444;color:#fff;padding:12px;border-radius:8px;text-align:center;font-size:16px;font-weight:bold}.qbtn{padding:10px 14px;background:#2a2a3a;color:#fff;border:none;border-radius:8px;font-weight:bold}.betbtn{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer}.bet{background:#00c851;color:#fff}.cash{background:#ffcc00;color:#000}.wait{background:#444;color:#aaa}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:99;justify-content:center;align-items:center}.modal.active{display:flex}.mbox{background:#1e1e2e;border:2px solid #ff0040;border-radius:15px;padding:20px;width:90%;max-width:340px}.mbox input{width:100%;background:#0e0e14;border:1px solid #444;color:#fff;padding:12px;border-radius:8px;margin:8px 0}</style></head><body><div class="header"><div style="font-weight:900;color:#ff0040">✈️ AVIATOR</div><div style="display:flex;gap:8px;align-items:center"><div class="bal"><span id="coinName">COIN</span>: <span id="bal">5000</span></div><button class="add" onclick="document.getElementById('modal').classList.add('active')">+ ADD COIN</button></div></div><div class="box"><div class="hist" id="hist"></div><div class="game"><svg style="position:absolute;left:0;bottom:0;width:100%;height:100%;z-index:1" viewBox="0 0 400 300" preserveAspectRatio="none"><path id="path" d="" stroke="#ff0033" stroke-width="4" fill="none"/></svg><div class="st" id="st">Waiting...</div><div class="mult" id="ml">1.00x</div><div class="plane" id="pl">✈️</div></div><div class="panel"><div class="row"><button class="qbtn" onclick="setB(100)">100</button><button class="qbtn" onclick="setB(500)">500</button><button class="qbtn" onclick="setB(1000)">1000</button><input type="number" id="bet" value="100"></div><button class="betbtn bet" id="abtn" onclick="doAction()">BET - 100 COIN</button></div></div><div class="modal" id="modal"><div class="mbox"><h3 style="color:#ff0040;text-align:center">💰 ADD COIN</h3><input type="text" id="cName" placeholder="Coin Name - USDT, INR"><input type="number" id="cAmt" placeholder="Amount - 1000"><div style="display:flex;gap:10px;margin-top:12px"><button onclick="document.getElementById('modal').classList.remove('active')" style="flex:1;padding:12px;background:#333;color:#fff;border:none;border-radius:8px">Cancel</button><button onclick="addCoin()" style="flex:1;padding:12px;background:#00c851;color:#fff;border:none;border-radius:8px">ADD</button></div></div></div><script>let balance=5000,bet=100,coinName="COIN",isBet=false,isCash=false,mult=1,crashAt=2.5,hist=[2.14,1.08,5.33,1.01,12.4],interval=null,startTime=0,trailPoints=[];function setB(v){document.getElementById('bet').value=v;bet=v;updateBtn()}function updateBtn(){bet=parseInt(document.getElementById('bet').value)||100;if(!isBet){document.getElementById('abtn').className='betbtn bet';document.getElementById('abtn').textContent=`BET - ${bet} ${coinName}`}}function drawHist(){let h=document.getElementById('hist');h.innerHTML='';hist.slice(-12).forEach(v=>{let d=document.createElement('div');d.className='h';d.style.background=v<2?'#ff4444':v<5?'#44aa44':'#ffaa00';d.textContent=v.toFixed(2)+'x';h.appendChild(d)})}drawHist();function genCrash(){let r=Math.random();if(r<0.45)return 1+Math.random()*0.9;if(r<0.75)return 2+Math.random()*2;if(r<0.92)return 4+Math.random()*6;return 10+Math.random()*90}function addCoin(){let n=document.getElementById('cName').value.trim()||"COIN";let a=parseInt(document.getElementById('cAmt').value)||0;if(a<=0){alert('Amount daalo!');return}coinName=n.toUpperCase();balance+=a;document.getElementById('coinName').textContent=coinName;document.getElementById('bal').textContent=balance;document.getElementById('modal').classList.remove('active');updateBtn()}function startRound(){mult=1;crashAt=genCrash();trailPoints=[];document.getElementById('ml').textContent='1.00x';document.getElementById('ml').style.color='#fff';document.getElementById('pl').style.left='15px';document.getElementById('pl').style.bottom='20px';document.getElementById('pl').textContent='✈️';document.getElementById('st').textContent='FLYING...';document.getElementById('st').style.background='#00c851';document.getElementById('path').setAttribute('d','');if(isBet){document.getElementById('abtn').className='betbtn cash'}startTime=Date.now();clearInterval(interval);interval=setInterval(tick,50)}function tick(){let e=(Date.now()-startTime)/1000;mult=Math.pow(1.12,e*2.5);if(mult>=crashAt){crash();return}document.getElementById('ml').textContent=mult.toFixed(2)+'x';if(isBet&&!isCash){document.getElementById('abtn').textContent=`CASHOUT ${(bet*mult).toFixed(0)} ${coinName}`}let prog=Math.min(e*20,85);let x=15+prog*3.5;let y=20+prog*2.2;document.getElementById('pl').style.left=x+'px';document.getElementById('pl').style.bottom=y+'px';trailPoints.push({x:x+10,y:300-y});if(trailPoints.length>40)trailPoints.shift();let d='M '+trailPoints[0].x+' '+trailPoints[0].y;for(let i=1;i<trailPoints.length;i++){d+=' L '+trailPoints[i].x+' '+trailPoints[i].y}document.getElementById('path').setAttribute('d',d)}function crash(){clearInterval(interval);document.getElementById('ml').textContent=crashAt.toFixed(2)+'x';document.getElementById('ml').style.color='#ff4444';document.getElementById('st').textContent='CRASHED @ '+crashAt.toFixed(2)+'x';document.getElementById('st').style.background='#ff0033';document.getElementById('pl').textContent='💥';hist.push(crashAt);drawHist();isBet=false;isCash=false;setTimeout(()=>{document.getElementById('pl').textContent='✈️';document.getElementById('abtn').className='betbtn bet';updateBtn();let c=3;document.getElementById('st').textContent='Next in 3s';let t=setInterval(()=>{c--;document.getElementById('st').textContent='Next in '+c+'s';if(c<=0){clearInterval(t);startRound()}},1000)},2000)}function doAction(){if(isBet&&!isCash){let win=bet*mult;balance+=Math.floor(win);document.getElementById('bal').textContent=balance;isCash=true;document.getElementById('abtn').className='betbtn wait';document.getElementById('abtn').textContent=`WON ${Math.floor(win)} ${coinName} ✅`;return}bet=parseInt(document.getElementById('bet').value)||100;if(balance<bet){alert('Balance kam! ADD COIN karo');document.getElementById('modal').classList.add('active');return}balance-=bet;document.getElementById('bal').textContent=balance;isBet=true;isCash=false;document.getElementById('abtn').className='betbtn wait';document.getElementById('abtn').textContent='Waiting for next round...'}document.getElementById('bet').addEventListener('input',updateBtn);startRound();</script></body></html>
