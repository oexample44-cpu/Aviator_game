
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Saanp Sidhi Fix</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#ffcc00;color:#000}.header{background:#ff8c00;padding:10px;display:flex;justify-content:space-between;border-bottom:4px solid #000;position:sticky;top:0;z-index:20}.bal{background:#000;color:#ffcc00;padding:6px 12px;border-radius:20px;font-weight:900;font-size:12px}.add{background:#00c851;color:#fff;border:2px solid #000;padding:8px 14px;border-radius:20px;font-weight:900}.box{max-width:420px;margin:auto;padding:10px}.board{width:100%;aspect-ratio:1;background:#fff9c4;border:4px solid #000;border-radius:12px;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);position:relative}.cell{border:0.5px solid rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;position:relative}.cell.snake{background:#ff8a80!important}.cell.ladder{background:#a5d6a7!important}.pawn{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #000;z-index:10;transition:all 0.3s;display:flex;align-items:center;justify-content:center}.p1{background:red}.p2{background:#0066ff}.diceBox{background:#000;color:#ffcc00;border-radius:15px;padding:15px;margin:10px 0;text-align:center;border:3px solid #000}.dice{width:80px;height:80px;background:#fff;border:3px solid #000;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;cursor:pointer}.roll{width:100%;padding:16px;background:red;color:#fff;border:3px solid #fff;border-radius:12px;font-weight:900;font-size:18px;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99;justify-content:center;align-items:center;padding:15px}.modal.active{display:flex}.mbox{background:#fff;border:4px solid #000;border-radius:15px;padding:20px;width:100%;max-width:360px;text-align:center}</style></head><body><div class="header"><div style="font-weight:900">🐍 SNAKES & LADDERS</div><div style="display:flex;gap:6px"><div class="bal">COIN: <span id="bal">5000</span></div><button class="add" onclick="openContact()">+ ADD</button></div></div><div class="box"><div class="board" id="board"></div><div style="display:flex;gap:8px;margin:10px 0"><div style="flex:1;background:#000;color:#ffcc00;padding:10px;border-radius:10px;text-align:center;font-weight:900;font-size:12px">P1 🔴 <span id="p1">1</span></div><div style="flex:1;background:#000;color:#ffcc00;padding:10px;border-radius:10px;text-align:center;font-weight:900;font-size:12px">P2 🔵 <span id="p2">1</span></div><div style="flex:1;background:#000;color:#ffcc00;padding:10px;border-radius:10px;text-align:center;font-weight:900;font-size:12px">BET <span id="bi">100</span></div></div><div class="diceBox"><div class="dice" id="dice" onclick="doRoll()">🎲</div><div style="margin:6px;color:#fff">TURN: <b id="turn" style="color:#ffcc00">PLAYER 1 🔴</b></div><button class="roll" id="rb" onclick="doRoll()">🎲 ROLL - <span id="rbBet">100</span></button><div style="display:flex;gap:6px;margin-top:10px"><button onclick="setBet(100)" style="flex:1;padding:10px;background:#ffcc00;border:3px solid #fff;border-radius:8px;font-weight:900">100</button><button onclick="setBet(500)" style="flex:1;padding:10px;background:#ffcc00;border:3px solid #fff;border-radius:8px;font-weight:900">500</button><button onclick="setBet(1000)" style="flex:1;padding:10px;background:#ffcc00;border:3px solid #fff;border-radius:8px;font-weight:900">1000</button></div></div></div><div class="modal" id="m1"><div class="mbox"><h2>💰 COIN ADD KARO</h2><p style="margin:10px 0;font-weight:bold">Telegram: <b>@usaagent0</b></p><button onclick="goTelegram()" style="width:100%;padding:14px;background:#0088cc;color:#fff;border:3px solid #000;border-radius:10px;font-weight:900">📲 TELEGRAM KHOLO @usaagent0</button><button onclick="document.getElementById('m1').classList.remove('active')" style="width:100%;padding:10px;background:#000;color:#fff;border-radius:8px;margin-top:8px">CLOSE</button><hr style="margin:12px 0"><input id="ma" type="number" placeholder="1000" style="width:100%;padding:10px;border:3px solid #000;border-radius:8px"><button onclick="testAdd()" style="width:100%;padding:10px;background:#00c851;color:#fff;border:3px solid #000;border-radius:8px;font-weight:900;margin-top:6px">TEST ADD</button></div></div><div class="modal" id="m2"><div class="mbox"><h2 id="wt">WIN!</h2><p id="ws" style="margin:10px;font-weight:900"></p><button onclick="resetGame()" style="width:100%;padding:14px;background:#ffcc00;border:3px solid #000;border-radius:10px;font-weight:900">PLAY AGAIN</button></div></div><script>let USERNAME="usaagent0";let tg=window.Telegram&&window.Telegram.WebApp;if(tg)tg.expand();let bal=5000,bet=100,cp=1,p1=1,p2=1,rolling=false;const snakes={99:54,70:55,52:42,56:8,43:17,50:5,27:5},ladders={3:51,6:27,20:70,36:55,63:95,68:98,34:71},board=document.getElementById('board');function build(){board.innerHTML='';for(let r=9;r>=0;r--){let arr=[];for(let c=0;c<10;c++)arr.push(r*10+c+1);if(r%2==1)arr.reverse();arr.forEach(n=>{let d=document.createElement('div');d.className='cell';d.id='cell'+n;if(snakes[n])d.classList.add('snake');if(ladders[n])d.classList.add('ladder');d.innerHTML='<span style="position:absolute;top:1px;left:2px;font-size:7px;opacity:0.6">'+n+'</span>'+(snakes[n]?'🐍':'')+(ladders[n]?'🪜':'');board.appendChild(d);});}let d1=document.createElement('div');d1.className='pawn p1';d1.id='pawn1';d1.innerHTML='🔴';board.appendChild(d1);let d2=document.createElement('div');d2.className='pawn p2';d2.id='pawn2';d2.innerHTML='🔵';board.appendChild(d2);setTimeout(()=>{place(1,1);place(2,1);},150);}function getPos(n){let el=document.getElementById('cell'+n);return el?{left:el.offsetLeft+2,top:el.offsetTop+4}:{left:0,top:0}}function place(p,n){let pos=getPos(n);let pawn=document.getElementById('pawn'+p);pawn.style.left=(pos.left+(p==2?14:0))+'px';pawn.style.top=pos.top+'px';}function setBet(v){bet=v;document.getElementById('bi').innerText=v;document.getElementById('rbBet').innerText=v;}function openContact(){document.getElementById('m1').classList.add('active');}function goTelegram(){let txt=encodeURIComponent('Hi Bhai! Saanp Sidhi me COIN add karwana hai 💰 Balance: '+bal);let url='https://t.me/'+USERNAME+'?text='+txt;if(tg)tg.openTelegramLink(url);else window.open(url,'_blank');}function testAdd(){let a=parseInt(document.getElementById('ma').value)||0;if(a<=0)return alert('Amount daalo');bal+=a;document.getElementById('bal').innerText=bal;document.getElementById('m1').classList.remove('active');}function doRoll(){if(rolling)return;if(bal<bet)return openContact();rolling=true;document.getElementById('rb').disabled=true;let dice=document.getElementById('dice'),t=0;let iv=setInterval(()=>{dice.innerText=Math.floor(Math.random()*6)+1;t++;if(t>10){clearInterval(iv);let v=Math.floor(Math.random()*6)+1;dice.innerText=v;move(v);}},80);}async function move(v){let cur=cp==1?p1:p2;let np=cur+v;if(np>100){rolling=false;document.getElementById('rb').disabled=false;return;}for(let i=cur+1;i<=np;i++){if(cp==1){p1=i;document.getElementById('p1').innerText=i;}else{p2=i;document.getElementById('p2').innerText=i;}place(cp,i);await new Promise(r=>setTimeout(r,180));}if(snakes[np]){await new Promise(r=>setTimeout(r,300));let to=snakes[np];if(cp==1){p1=to;document.getElementById('p1').innerText=to;}else{p2=to;document.getElementById('p2').innerText=to;}place(cp,to);}else if(ladders[np]){await new Promise(r=>setTimeout(r,300));let to=ladders[np];if(cp==1){p1=to;document.getElementById('p1').innerText=to;}else{p2=to;document.getElementById('p2').innerText=to;}place(cp,to);}if(p1>=100||p2>=100){let win=bet*2;bal+=win;document.getElementById('bal').innerText=bal;document.getElementById('wt').innerText='🎉 PLAYER '+cp+' WON!';document.getElementById('ws').innerText='+'+win+' COIN';document.getElementById('m2').classList.add('active');return;}cp=cp==1?2:1;document.getElementById('turn').innerText='PLAYER '+cp+' '+(cp==1?'🔴':'🔵');rolling=false;document.getElementById('rb').disabled=false;}function resetGame(){document.getElementById('m2').classList.remove('active');p1=1;p2=1;cp=1;document.getElementById('p1').innerText=1;document.getElementById('p2').innerText=1;document.getElementById('turn').innerText='PLAYER 1 🔴';rolling=false;document.getElementById('rb').disabled=false;document.getElementById('dice').innerText='🎲';place(1,1);place(2,1);}build();window.addEventListener('resize',()=>{place(1,p1);place(2,p2);});</script></body></html>
